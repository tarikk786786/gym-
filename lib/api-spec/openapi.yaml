openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact and newsletter operations
  - name: profile
    description: User profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      description: Submit a contact or newsletter sign-up message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "200":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [contact]
      summary: Subscribe to newsletter
      description: Subscribe an email address to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "200":
          description: Subscribed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      description: Returns the authenticated user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found (onboarding not completed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Create or update user profile
      description: Upserts the authenticated user's profile data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        subject:
          type: string
        message:
          type: string
          minLength: 1
        type:
          type: string
          enum: [contact, newsletter]
      required:
        - name
        - email
        - message
    NewsletterInput:
      type: object
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
      required:
        - email
    ContactResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    UserProfile:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        gender:
          type: ["string", "null"]
        heightCm:
          type: ["number", "null"]
        weightKg:
          type: ["number", "null"]
        goal:
          type: ["string", "null"]
        activityLevel:
          type: ["string", "null"]
        workoutExperience:
          type: ["string", "null"]
        medicalConditions:
          type: ["string", "null"]
        injuries:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        chestCm:
          type: ["number", "null"]
        waistCm:
          type: ["number", "null"]
        hipsCm:
          type: ["number", "null"]
        armsCm:
          type: ["number", "null"]
        thighsCm:
          type: ["number", "null"]
        shouldersCm:
          type: ["number", "null"]
        dailyCalories:
          type: ["integer", "null"]
        foodPreference:
          type: ["string", "null"]
        sleepHours:
          type: ["number", "null"]
        stressLevel:
          type: ["integer", "null"]
        waterIntakeLiters:
          type: ["number", "null"]
        gymAvailability:
          type: ["boolean", "null"]
        equipment:
          type: ["string", "null"]
        workoutDaysPerWeek:
          type: ["integer", "null"]
        preferredWorkoutTime:
          type: ["string", "null"]
        onboardingCompleted:
          type: ["boolean", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - createdAt
        - updatedAt
    ProfileInput:
      type: object
      properties:
        fullName:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        gender:
          type: ["string", "null"]
        heightCm:
          type: ["number", "null"]
        weightKg:
          type: ["number", "null"]
        goal:
          type: ["string", "null"]
        activityLevel:
          type: ["string", "null"]
        workoutExperience:
          type: ["string", "null"]
        medicalConditions:
          type: ["string", "null"]
        injuries:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        chestCm:
          type: ["number", "null"]
        waistCm:
          type: ["number", "null"]
        hipsCm:
          type: ["number", "null"]
        armsCm:
          type: ["number", "null"]
        thighsCm:
          type: ["number", "null"]
        shouldersCm:
          type: ["number", "null"]
        dailyCalories:
          type: ["integer", "null"]
        foodPreference:
          type: ["string", "null"]
        sleepHours:
          type: ["number", "null"]
        stressLevel:
          type: ["integer", "null"]
        waterIntakeLiters:
          type: ["number", "null"]
        gymAvailability:
          type: ["boolean", "null"]
        equipment:
          type: ["string", "null"]
        workoutDaysPerWeek:
          type: ["integer", "null"]
        preferredWorkoutTime:
          type: ["string", "null"]
        onboardingCompleted:
          type: ["boolean", "null"]
